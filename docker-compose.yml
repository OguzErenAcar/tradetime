services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alarm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alarm_dev_pw}
      POSTGRES_DB: bist_alarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alarm_app -d bist_alarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alarm_app:${POSTGRES_PASSWORD:-alarm_dev_pw}@postgres:5432/bist_alarm
      VAPID_PRIVATE_KEY_FILE: vapid_private_key.pem
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - ./backend/vapid_private_key.pem:/app/vapid_private_key.pem:ro
    ports:
      # 127.0.0.1'e bağlı: Docker'ın iptables kuralları ufw'yi bypass edip
      # 0.0.0.0'a bağlı portları dışarıdan erişilebilir bırakabiliyor — bu
      # yüzden dış dünyaya kapalı olması gereken servisler (prod'da sadece
      # Caddy dışa açık olmalı) host'un localhost'una sabitlendi. Local
      # dev'de tarayıcıdan `localhost:PORT` erişimini etkilemiyor.
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Sadece VPS/prod'da: `docker compose --profile prod up -d` ile devreye
  # girer, 80/443'ü üstlenip Let's Encrypt sertifikasını otomatik alır,
  # /api/* -> backend, geri kalan her şey -> frontend'e yönlendirir.
  # Local dev'de (plain `docker compose up`) hiç başlamaz.
  caddy:
    image: caddy:2
    profiles: ["prod"]
    depends_on:
      - backend
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
