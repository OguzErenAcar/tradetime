services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: alarm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alarm_dev_pw}
      POSTGRES_DB: bist_alarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alarm_app -d bist_alarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alarm_app:${POSTGRES_PASSWORD:-alarm_dev_pw}@postgres:5432/bist_alarm
      VAPID_PRIVATE_KEY_FILE: vapid_private_key.pem
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - ./backend/vapid_private_key.pem:/app/vapid_private_key.pem:ro
    ports:
      # 127.0.0.1'e bağlı: Docker'ın iptables kuralları ufw'yi bypass edip
      # 0.0.0.0'a bağlı portları dışarıdan erişilebilir bırakabiliyor — bu
      # yüzden dış dünyaya kapalı olması gereken servisler (prod'da sadece
      # Caddy dışa açık olmalı) host'un localhost'una sabitlendi. Local
      # dev'de tarayıcıdan `localhost:PORT` erişimini etkilemiyor.
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  # Prod Caddy (80/443, SITE_ADDRESS) artık burada değil (2026-09-18) -- bu VPS aynı zamanda
  # alakasız bir başka proje (clipbot) de barındırıyor, ve clipbot standart olmayan bir portta
  # (8090) çalıştığı için bazı ISP/mobil operatörler tarafından filtreleniyordu. Kalıcı çözüm:
  # 80/443'ü tutan TEK Caddy artık ne bu projeye ne clipbot'a ait, "edge-proxy" adında bağımsız
  # üçüncü bir proje olarak VPS'te ayrıca çalışıyor (bu repoda değil) ve backend/frontend'e
  # buradaki gibi reverse_proxy yapıyor, ayrıca clipbot'un kendi servisine de. Kök `Caddyfile`
  # de bu yüzden kaldırıldı. TLS sertifika volume'ları (eskiden buradaki caddy_data/caddy_config)
  # de artık edge-proxy'nin kendi docker-compose.yml'inde "external: true" ile referans alınıyor
  # (aynı volume'lar, sertifika yeniden alınmadı) -- ayrıntı: clipbot repo'sundaki CLAUDE.md'nin
  # "edge-proxy" notu.

volumes:
  postgres_data:
